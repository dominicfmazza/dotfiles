# Package map for bootstrap.sh.
#
# Fields, separated by whitespace:
#   1. package   directory in the repo root
#   2. platforms comma list: linux, wsl, darwin, windows, or all
#   3. target    home            mirror the package tree into $HOME
#                xdg:<subpath>   mirror into $XDG_CONFIG_HOME/<subpath>
#                win:<subpath>   mirror into the Windows user profile
#   4. flags     optional. nofold keeps every directory real and links only
#                files, so the bootstrap can add its own files beside them.
#
# package      platforms            target                  flags
zsh            linux,wsl,darwin     home
nvim           linux,wsl,darwin     home
scripts        linux,wsl,darwin     home
mise           linux,wsl,darwin     home                    nofold
pi             linux,wsl,darwin     home                    nofold
lazygit        linux,wsl,darwin     home
yazi           linux,wsl,darwin     home
pi-lens        linux,wsl,darwin     home
rio/linux      linux                xdg:rio
kitty          linux,darwin         xdg:kitty
wezterm        linux,wsl,darwin     home
rio/windows    wsl,windows          win:AppData/Local/rio
komorebi       wsl,windows          win:.
glazewm        wsl,windows          win:.
