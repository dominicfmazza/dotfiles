# pi-allow-change-comment: this header is the format reference for the file.
#
# The rows below tell the bootstrap what to put on a host. To add or remove
# a package, a seed, or a real directory, edit a row. No script changes.
#
# Fields are separated by whitespace. A `#` starts a comment. Each row
# starts with a kind:
#
#   link  <package> <platforms> <target> [nofold]
#         The bootstrap mirrors the repo directory <package> into <target>.
#         <target> is one of:
#           home            $HOME
#           xdg:<subpath>   $XDG_CONFIG_HOME/<subpath>
#           win:<subpath>   the Windows user profile. `win:.` is its root.
#         With nofold, every directory stays real and only files are links.
#         A tool can then write its own files beside the links.
#
#   seed  <template> <destination> [platforms]
#         The bootstrap copies install/templates/<template> to <destination>
#         one time. It never overwrites the copy. Use a seed for a file that
#         a tool rewrites, or that holds a host value or a secret.
#
#   real  <directory>
#         The bootstrap keeps <directory> a real directory. It never links
#         it into the repo. Use this for a directory that a tool writes into.
#
# <platforms> is a comma list of linux, wsl, darwin, windows, or all. The
# default is all. A path can start with ~ or $XDG_CONFIG_HOME.
#
# The mise profiles are in mise.toml, under [vars].

# kind  package        platforms            target                  flags
link    zsh            linux,wsl,darwin     home
link    nvim           linux,wsl,darwin     home
link    scripts        linux,wsl,darwin     home
link    tmux           linux,wsl,darwin     home
link    ssh            linux,wsl,darwin     home                    nofold
link    mise           linux,wsl,darwin     home                    nofold
link    pi             linux,wsl,darwin     home                    nofold
link    lazygit        linux,wsl,darwin     home
link    yazi           linux,wsl,darwin     home
link    rio/linux      linux                xdg:rio
link    kitty          linux,darwin         xdg:kitty
link    wezterm        linux,wsl,darwin     home
link    aerospace      darwin               home
link    simplebar      darwin               home
link    rio/windows    wsl,windows          win:AppData/Local/rio
link    komorebi       wsl,windows          win:.
link    glazewm        wsl,windows          win:.

# kind  template            destination                                platforms
seed    hosts.sh            $XDG_CONFIG_HOME/environments/hosts.sh
seed    paths.sh            $XDG_CONFIG_HOME/environments/paths.sh
seed    langs.sh            $XDG_CONFIG_HOME/environments/langs.sh
seed    env.json            ~/.env.json
seed    pi/settings.json    ~/.pi/agent/settings.json                  linux,wsl,darwin
seed    pi/models.json      ~/.pi/agent/models.json                    linux,wsl,darwin
seed    pi/mcp.json         ~/.pi/agent/mcp.json                       linux,wsl,darwin

# kind  directory
real    ~/.local
real    ~/.local/bin
real    ~/.local/share
real    ~/.local/state
real    ~/.cache
real    $XDG_CONFIG_HOME
real    $XDG_CONFIG_HOME/mise
real    ~/.ssh
real    ~/.ssh/config.d
