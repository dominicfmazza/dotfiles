# Settings for every host. ~/.ssh/config includes this file at the end,
# so a value in a Host block there wins.

Host *
    # One connection per host carries every shell, scp, and Mutagen session.
    ControlMaster auto
    ControlPath ~/.ssh/cm/%C
    ControlPersist 10m
    # A keepalive every 30 seconds finds a dead link in 2 minutes.
    ServerAliveInterval 30
    ServerAliveCountMax 4
