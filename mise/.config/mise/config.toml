[settings]
experimental = true

# Tools live in conf.d. mise merges every file in that directory.
#   00-core.toml    shell and terminal basics
#   10-lang.toml    language runtimes and the rootless compiler
#   20-editor.toml  language servers and formatters for Neovim
#   30-work.toml    employer-specific tools
#
# bootstrap.sh --profile core|editor|full|work decides which files it links.

[env]
UV_NATIVE_TLS = "true"
NODE_OPTIONS = "--use-system-ca"
_.file = "~/.env.json"
