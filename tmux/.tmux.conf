unbind '"'
unbind %
unbind c

# Prefix
unbind C-b
set-option -g prefix C-Space
bind C-Space send-prefix

# binds
bind  c  new-window      -c "#{pane_current_path}"
bind  |  split-window -h -c "#{pane_current_path}"
bind '-' split-window -v -c "#{pane_current_path}"
bind r source-file ~/.tmux.conf

# Terminal
if-shell 'infocmp tmux-256color >/dev/null 2>&1' \
  'set -g default-terminal "tmux-256color"' \
  'set -g default-terminal "xterm-256color"'
# kitty reports TERM=xterm-kitty. The features turn on true color, links,
# the clipboard, extended keys, and styled underlines for that terminal.
set -as terminal-features ',xterm-kitty:RGB:hyperlinks:clipboard:extkeys:sync:usstyle'
set -as terminal-features ',xterm-256color:RGB:hyperlinks:clipboard'
set -as terminal-features ',wezterm:RGB:hyperlinks:clipboard:usstyle'

# Options
set -g set-clipboard on
# Send OSC 52 read replies on to the pane program, for example nvim.
set -s get-clipboard both
set -gq allow-passthrough on
set -g visual-activity off
set -s escape-time 10
set -g history-limit 50000
set -g display-time 4000
set -g status-interval 5
set -g status-keys vi
set -g extended-keys on
set -g extended-keys-format csi-u
set-window-option -g mode-keys vi
set -g focus-events on
setw -g aggressive-resize on

bind-key -T copy-mode-vi 'v' send -X begin-selection
# y copies the selection. oob copy sends it to the local clipboard.
bind-key -T copy-mode-vi 'y' send -X copy-pipe-and-cancel 'oob copy 2>/dev/null || cat >/dev/null'
# o opens the selection. On an SSH host, oob-open sends it to the local browser.
bind-key -T copy-mode-vi 'o' send -X copy-pipe-and-cancel 'oob open - >/dev/null 2>&1'

# Status
set -g status-position bottom
set -g status-justify absolute-centre
set -g status-style "bg=default"
set -g status-left ""
set -g status-right "#S"
set -g window-status-current-style "fg=blue bold"

# An SSH session shows the hostname in yellow, so a nested tmux is clear.
if-shell '[ -n "$SSH_CONNECTION" ]' \
  'set -g status-right "#[fg=yellow]#h#[default] #S"'

# F12 sends every key to the inner tmux on an SSH host. F12 again turns it back.
bind -T root F12 \
  set prefix None \; \
  set key-table off \; \
  set status-style "fg=brightblack,bg=default" \; \
  refresh-client -S
bind -T off F12 \
  set -u prefix \; \
  set -u key-table \; \
  set -u status-style \; \
  refresh-client -S

set -g allow-rename off
set -g mouse on

# A reattach copies these variables from the new client into the session.
# A new pane then gets the current SSH agent and the current oob socket.
set -g update-environment 'DISPLAY WAYLAND_DISPLAY SSH_AUTH_SOCK SSH_CONNECTION SSH_TTY OOB_SOCK KITTY_WINDOW_ID TERM_PROGRAM'
