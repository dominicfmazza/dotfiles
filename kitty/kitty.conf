# kitty config. Matches the rio and wezterm setup: Hack Nerd Font, the
# vague palette, a block cursor, and a tab bar that hides for a single tab.

# ------------------------------------------------------------------- font ----

font_family      Hack Nerd Font
font_size        16.0

# ----------------------------------------------------------------- cursor ----

cursor_shape          block
cursor_blink_interval 0

# ----------------------------------------------------------------- window ----

remember_window_size  no
initial_window_width  120c
initial_window_height 28c

window_padding_width  4
hide_window_decorations no
confirm_os_window_close 0

# ------------------------------------------------------------------- tabs ----

# Hide the tab bar when only one tab is open, like rio's hide-if-single.
tab_bar_min_tabs     2
tab_bar_edge         top
tab_bar_style        powerline
tab_powerline_style  slanted

# --------------------------------------------------------------- vague theme ----

background            #141415
foreground            #cdcdcd

selection_background  #252530
selection_foreground  #cdcdcd

cursor                #cdcdcd
cursor_text_color     #141415

# black
color0  #252530
color8  #606079
# red
color1  #d8647e
color9  #e08398
# green
color2  #7fa563
color10 #99b782
# yellow
color3  #f3be7c
color11 #f5cb96
# blue
color4  #6e94b2
color12 #8ba9c1
# magenta
color5  #bb9dbd
color13 #c9b1ca
# cyan
color6  #aeaed1
color14 #bebeda
# white
color7  #cdcdcd
color15 #d7d7d7

# tab bar colors
active_tab_background    #252530
active_tab_foreground    #cdcdcd
active_tab_font_style    normal
inactive_tab_background  #141415
inactive_tab_foreground  #606079
inactive_tab_font_style  normal
